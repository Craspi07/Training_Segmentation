[build-system]
requires = ["setuptools>=43", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellseg_trainer"
version = "0.1.0"
description = "Production-quality cell segmentation training package for microscopy images"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["cell segmentation", "microscopy", "detectron2", "instance segmentation"]

dependencies = [
    "numpy>=1.24",
    "tifffile>=2023.7",
    "pycocotools>=2.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "scipy>=1.10",
    # opencv-python-headless is listed here so dependency scanners recognise the
    # cv2 import; the package includes scipy fallbacks and works without it.
    # Conda users should instead: conda install -c conda-forge opencv
    # and then install this package with --no-deps or override the dep.
    "opencv-python-headless>=4.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

# Extra loaders used by the legacy src/ scripts (not required by the package)
nd2 = ["nd2>=0.5"]
ome = ["aicsimageio>=4.0"]
scikit = ["scikit-image>=0.20"]

# detectron2 cannot be installed via PyPI — it must be built from source.
# See: https://detectron2.readthedocs.io/en/latest/tutorials/install.html
# The training and inference modules import detectron2 lazily and give a
# clear error message if it is missing.
# detectron2 = []   # intentionally empty — listed for documentation only

[project.scripts]
cellseg_trainer = "cellseg_trainer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cellseg_trainer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
