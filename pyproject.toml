[build-system]
requires = ["setuptools>=43", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellseg_trainer"
version = "0.1.0"
description = "Production-quality cell segmentation training package for microscopy images"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["cell segmentation", "microscopy", "detectron2", "instance segmentation"]

dependencies = [
    "numpy>=1.24",
    "tifffile>=2023.7",
    "pycocotools>=2.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
ome = ["aicsimageio>=4.0"]
# opencv-python conflicts with conda's opencv package; install via conda instead:
#   conda install -c conda-forge opencv
# or pip install cellseg_trainer[cv2] for pip-only environments
cv2 = ["opencv-python-headless>=4.7"]
# detectron2 requires special installation — see https://detectron2.readthedocs.io/
# pip install cellseg_trainer[detectron2] is NOT supported; install detectron2 separately
detectron2 = []

[project.scripts]
cellseg_trainer = "cellseg_trainer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cellseg_trainer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
