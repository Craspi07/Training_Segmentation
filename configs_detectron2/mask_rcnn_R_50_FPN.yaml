# Detectron2 config for LIVECell-style cell instance segmentation
# Based on: Edlund et al. (2021) LIVECell — Nature Methods
# https://www.nature.com/articles/s41592-021-01249-6
#
# Anchor-based Mask R-CNN, ResNet-50 + FPN backbone.
# Pretrained on MS-COCO 2017; fine-tuned on your cell dataset.
#
# Key deviations from vanilla COCO defaults (from the paper):
#   • Anchor sizes reduced to (4,9,17,31,64,127) for small cells
#   • Anchor aspect ratios extended to (0.25,0.5,1,2,4)
#   • Linear LR warmup, warmup factor 0.001, 1 000 warmup iters
#   • Multi-scale training: shortest side ∈ {440,480,520,580,620}
#   • Pixel normalisation: mean 128, std 11.58 (LIVECell grayscale)

MODEL:
  META_ARCHITECTURE: "GeneralizedRCNN"
  BACKBONE:
    NAME: "build_resnet_fpn_backbone"
    FREEZE_AT: 2
  RESNETS:
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
    DEPTH: 50
  FPN:
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
  ANCHOR_GENERATOR:
    # Reduced anchor sizes for small cells (paper Table S3)
    SIZES: [[4], [9], [17], [31], [64], [127]]
    ASPECT_RATIOS: [[0.25, 0.5, 1.0, 2.0, 4.0]]
  RPN:
    IN_FEATURES: ["p2", "p3", "p4", "p5", "p6"]
    PRE_NMS_TOPK_TRAIN: 2000
    PRE_NMS_TOPK_TEST:  1000
    POST_NMS_TOPK_TRAIN: 1000
    POST_NMS_TOPK_TEST:  500
    NMS_THRESH: 0.7
    BATCH_SIZE_PER_IMAGE: 256
    POSITIVE_FRACTION: 0.5
  ROI_HEADS:
    NAME: "StandardROIHeads"
    IN_FEATURES: ["p2", "p3", "p4", "p5"]
    NUM_CLASSES: 1           # overridden at runtime from GUI / CLI
    BATCH_SIZE_PER_IMAGE: 512
    POSITIVE_FRACTION: 0.25
    SCORE_THRESH_TEST: 0.05
    NMS_THRESH_TEST: 0.5
  ROI_BOX_HEAD:
    NAME: "FastRCNNConvFCHead"
    NUM_FC: 2
    POOLER_RESOLUTION: 7
    POOLER_SAMPLING_RATIO: 0
    POOLER_TYPE: "ROIAlignV2"
    FC_DIM: 1024
  ROI_MASK_HEAD:
    NAME: "MaskRCNNConvUpsampleHead"
    NUM_CONV: 4
    POOLER_RESOLUTION: 14
    POOLER_SAMPLING_RATIO: 0
    POOLER_TYPE: "ROIAlignV2"
    CONV_DIM: 256
  MASK_ON: true
  # COCO-pretrained weights (Detectron2 model zoo)
  WEIGHTS: "detectron2://COCO-InstanceSegmentation/mask_rcnn_R_50_FPN_3x/137849600/model_final_f10217.pkl"
  # Pixel normalisation for LIVECell grayscale images (paper §Methods)
  PIXEL_MEAN: [128.0, 128.0, 128.0]
  PIXEL_STD:  [11.58, 11.58, 11.58]

INPUT:
  # Multi-scale training augmentation (paper: shortest side ∈ {440,480,520,580,620})
  MIN_SIZE_TRAIN: (440, 480, 520, 580, 620)
  MAX_SIZE_TRAIN: 1333
  MIN_SIZE_TEST:  520
  MAX_SIZE_TEST:  1333
  MIN_SIZE_TRAIN_SAMPLING: "choice"
  FORMAT: "BGR"             # Detectron2 standard; grayscale TIFFs are converted

DATASETS:
  TRAIN: ("cellseg_train",)   # registered at runtime
  TEST:  ("cellseg_val",)

DATALOADER:
  NUM_WORKERS: 4
  ASPECT_RATIO_GROUPING: true
  FILTER_EMPTY_ANNOTATIONS: true

SOLVER:
  IMS_PER_BATCH: 4          # 2 images/GPU × 2 GPUs (scale to your setup)
  BASE_LR: 0.00625          # 0.02 * (IMS_PER_BATCH / 16) — linear scaling rule
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.0001
  # LR schedule: decay at 80 % and 90 % of MAX_ITER
  STEPS: (8000, 9000)
  MAX_ITER: 10000
  GAMMA: 0.1
  # Linear warmup (paper: warmup_factor=0.001, warmup_iters=1000)
  WARMUP_FACTOR: 0.001
  WARMUP_ITERS: 1000
  WARMUP_METHOD: "linear"
  CHECKPOINT_PERIOD: 500
  CLIP_GRADIENTS:
    ENABLED: false

TEST:
  EVAL_PERIOD: 500

VERSION: 2
